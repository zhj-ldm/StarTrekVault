<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000">
<title>FM - LCARSDE File Manager</title>
<style>
/* ===== ORIGINAL lcarsde style.css (complete, unmodified selectors) ===== */
@font-face {
  font-family: 'LCARSGTJ3';
  font-style: normal;
  font-weight: 400;
  src: local('LCARSGTJ3'), local('LCARSGTJ3'),
       url('font/LCARSGTJ3.woff') format('woff'),
       url('font/LCARSGTJ3.ttf') format('truetype');
}

/* tiny layout */
html {
  height: 100%;
}

*,
*::before,
*::after {
  margin: 0;
  padding: 0;
  border: 0;
  box-sizing: border-box;
}

body {
  min-height: 100%;
  background-color: #000;
  font-size: 16px;
  color: #fff;
  font-family: 'Open Sans', sans-serif;
  display: grid;
  grid-template-columns: 1fr;
  grid-template-rows: auto auto auto 1fr auto;
  grid-template-areas: "header" "nav" "nav-main-sep" "main" "footer";
  padding: .5em;
  --side-bar-width: 5em;
  --LCARS-spacing: 0.028em;
}

h1, h2, h3, h4, h5, h6 {
  font-family: 'LCARSGTJ3', monospace;
  font-size: 1em;
  font-weight: normal;
  letter-spacing: var(--LCARS-spacing);
}

code {
  padding: 1px;
  background-color: #333;
}

#header {
  grid-area: header;
  font-size: 2.5em;
  width: 100%;
  display: grid;
  grid-template-rows: 1em auto;
  grid-template-columns: .8em 1fr .8em;
  grid-template-areas:
    "hleft hspace hright"
    ". hlogo .";
  grid-gap: .2em;
}

#nav__container {
  grid-area: nav;
  padding: .5em 2.55em 0;
}

#main__container {
  grid-area: main;
  padding: .5em 2.55em 0;
  color: #99c;
  max-width: 65em;
}

#footer {
  grid-area: footer;
  font-size: 2.5em;
  width: 100%;
  padding-top: .25em;
  display: grid;
  grid-template-rows: 1em;
  grid-template-columns: .8em 1fr .8em;
  grid-gap: .2em;
  grid-template-areas: "fleft fspace fright";
}

/* bars */
.bar--left {
  display: block;
  background-color: #99f;
  border-radius: 1em 0 0 1em;
}

.bar--space {
  display: block;
  background-color: #c9c;
}

.bar--sep {
  display: none;
  position: relative;
  background-color: #c9c;
}

.bar--right {
  display: block;
  background-color: #99f;
  border-radius: 0 1em 1em 0;
}

/* header */
.header__header {
  height: 100%;
  text-align: center;
  line-height: 1;
}

.header--left { grid-area: hleft; }
.header__logo {
  grid-area: hlogo;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding-top: 0.08em;
}
.header--space { grid-area: hspace; }
.header--sep {
  grid-area: hsep;
  border-top-left-radius: 2em;
}
.header--right { grid-area: hright; }

.header__name--short { text-transform: uppercase; }
.header__name--long { display: none; text-transform: uppercase; }

.header__link {
  text-decoration: none;
  color: #f90;
  font-family: 'LCARSGTJ3', 'sans-serif';
  font-size: 1.36em;
}

/* navigation */
.nav__list {
  display: grid;
  grid-template-columns: 1fr;
  grid-gap: .3em;
  list-style-type: none;
  font-family: 'LCARSGTJ3', monospace;
}

.nav__link {
  display: flex;
  justify-content: flex-start;
  align-items: flex-end;
  position: relative;
  min-height: 42px;
  height: 2.3em;
  font-size: 1.25em;
  letter-spacing: var(--LCARS-spacing);
  background-color: #f96;
  border-radius: 2.3em;
  color: #000;
  text-decoration: none;
  padding: .2em 1.2em;
  cursor: pointer;
}

.nav__link:focus,
.nav__link:hover {
  background-color: #c9c;
}

/* main-nav separator */
.bar__main-nav-separator {
  grid-area: nav-main-sep;
  display: grid;
  grid-template-columns: .7em 1fr .7em;
  grid-template-rows: 1em;
  grid-gap: .5em;
  grid-template-areas: "mleft mspace mright";
  padding: .5em 0 0;
  z-index: 0;
  position: relative;
}
.bar__main-nav--left { grid-area: mleft; }
.bar__main-nav--space { grid-area: mspace; }
.bar__main-nav--right { grid-area: mright; }

/* footer */
.footer--left { grid-area: fleft; }
.footer--space { grid-area: fspace; }
.footer--sep {
  grid-area: fsep;
  border-bottom-left-radius: 2em;
}
.footer--right { grid-area: fright; }

/* content */
#main__container h1,
#main__container h2,
#main__container h3,
#main__container h4 {
  color: #f90;
  font-family: 'LCARSGTJ3', sans-serif;
  margin: .1em 0 .3em;
}
#main__container h1 { font-size: 2.2em; }
#main__container h2 { font-size: 1.8em; }
#main__container h3 { font-size: 1.5em; }
#main__container h4 { font-size: 1.3em; }
#main__container p { margin: 0 0 .7em; line-height: 1.4em; }
#main__container ul { margin: 0 0 .7em; padding-left: 1.5em; line-height: 1.4em; }

.news__header {
  margin: 0 0 .3em;
  display: flex;
  flex-direction: column;
}
.news__header--title { display: inline-block; flex-grow: 1; }
.news__header--time {
  align-self: flex-end;
  flex-shrink: 0;
  font-size: .9em;
  color: #fc9;
}

#main__container a {
  font-style: italic;
  color: #f96;
  text-decoration: none;
}
#main__container img { display: block; max-width: 90%; margin: 0 auto 0.7em; }
#main__container a:focus,
#main__container a:hover { text-decoration: underline; }
#main__container > :first-child { margin-top: 0; }
#main__container > :last-child { margin-bottom: 0; }

strong { color: #c66; }
.note { color: #f96; }

dl { margin: 0 0 .7em; line-height: 1.4em; }
dt { color: #c9c; font-style: italic; word-break: break-word; }
dt:not(:first-child) { margin-top: .5em; }

.warning {
  display: flex;
  flex-direction: column;
  gap: .5rem;
  color: #fff;
}
.warning h2 { color: #fff !important; height: 100%; }
.warning > header {
  display: grid;
  grid-template-rows: 1.5em;
  grid-template-columns: 1.2em auto 1fr 1.2em;
  grid-gap: .5rem;
  align-items: center;
}
.warning > footer {
  display: grid;
  grid-template-rows: 1.5em;
  grid-template-columns: 1.2em 1fr 1.2em;
  grid-gap: .5rem;
  align-items: center;
}
.warning :is(.bar--left, .bar--right, .bar--space) {
  height: 100%;
  background-color: #cc6666;
}

/* small layout */
@media screen and (min-width: 35em) {
  #header {
    grid-template-rows: 1em;
    grid-template-columns: .8em auto 1fr .8em;
    grid-template-areas: "hleft hlogo hspace hright";
  }
  .header__name--short { width: unset; height: 1em; }
  .nav__list { grid-template-columns: 1fr 1fr; }
  .news__header { flex-direction: row; justify-content: space-between; }
  .news__header--time { align-self: center; }
  dl { display: grid; grid-template-columns: auto 1fr; column-gap: .5em; row-gap: .5em; }
  dt:not(:first-child) { margin-top: 0; }
}

/* medium layout */
@media screen and (min-width: 54em) {
  body {
    grid-template-columns: auto 1fr;
    grid-template-rows: auto 1fr auto;
    grid-template-areas: "header header" "nav main" "footer footer";
  }
  .bar--space { background-color: #99f; }
  .bar--sep { display: block; }
  .bar--left { display: none; }
  .warning .bar--left { display: block !important; }

  #header {
    grid-template-rows: 1em .25em;
    grid-template-columns: 7em 1fr auto .8em;
    grid-template-areas: "hsep hspace hlogo hright";
    grid-row-gap: 0;
  }
  .header--sep { height: 1em; }
  .header--sep::after {
    content: '';
    display: block;
    position: absolute;
    left: calc(var(--side-bar-width) - .25em);
    top: 1em;
    width: .25em;
    height: .25em;
    background-color: #000;
    border-top-left-radius: 100%;
  }
  .header--sep::before {
    content: '';
    display: block;
    position: absolute;
    left: 0;
    top: 1em;
    height: .25em;
    width: var(--side-bar-width);
    background-color: #c9c;
  }

  #nav__container {
    display: grid;
    grid-template-rows: auto auto 1fr;
    grid-template-columns: auto;
    padding: .5em 0;
  }
  .nav { padding: .5em 0; }

  .nav__bar--top {
    display: block;
    height: .8em;
    font-size: 2.5em;
    width: calc(var(--side-bar-width) - .25em);
    background-color: #99c;
  }

  .nav__list {
    grid-template-columns: 1fr;
    width: calc(var(--side-bar-width) * 2.5 - .625em);
  }

  .nav__bar--bottom {
    display: block;
    font-size: 2.5em;
    width: calc(var(--side-bar-width) - .25em);
    background-color: #99c;
  }

  .nav__link {
    justify-content: flex-end;
    border-radius: 0;
    background-color: #99f;
    padding-right: .4em;
    z-index: 1;
  }

  .nav__link::before {
    content: attr(data-num);
    display: flex;
    justify-content: center;
    align-items: center;
    position: absolute;
    font-size: 1.4em;
    color: #c69;
    background-color: #000;
    height: 100%;
    width: 1.4em;
    min-height: 42px;
    line-height: 1em;
    left: calc(100% - 0.2em);
    top: 0;
    padding: 0.08em 2% 0;
    z-index: 3;
  }

  .nav__link::after {
    content: '';
    display: block;
    position: absolute;
    background-color: #99f;
    height: 100%;
    min-height: 42px;
    width: 1.6em;
    top: 0;
    left: calc(100% + 1.2em);
    border-radius: 0 1.6em 1.6em 0;
    z-index: 2;
  }

  .nav__link.active,
  .nav__link.active::after { background-color: #f96; }

  .nav__link:focus,
  .nav__link:hover,
  .nav__link:focus::after,
  .nav__link:hover::after { background-color: #c9c; }

  .bar__main-nav-separator { display: none; }
  #main__container { padding: .5em 2.55em 0 7em; }

  #footer {
    grid-template-columns: 8em 1fr .8em;
    grid-template-areas: "fsep fspace fright";
  }
  .footer--sep::after {
    content: '';
    display: block;
    position: absolute;
    left: calc(var(--side-bar-width) - .25em);
    top: -.25em;
    width: .25em;
    height: .25em;
    background-color: #000;
    border-bottom-left-radius: 100%;
  }
  .footer--sep::before {
    content: '';
    display: block;
    position: absolute;
    left: 0;
    top: -.25em;
    height: .25em;
    width: var(--side-bar-width);
    background-color: #c9c;
  }
}

/* ===== FILE MANAGER SPECIFIC STYLES ===== */
/* Main container flex layout: pathbar top, file list scrollable, statusbar bottom */
#main__container {
  display: flex !important;
  flex-direction: column;
  overflow: hidden;
}

/* Path breadcrumb bar */
.fm-pathbar {
  display: grid;
  grid-template-columns: 1.2em 1fr 1.2em;
  grid-template-rows: 1.5em;
  grid-gap: .5em;
  align-items: center;
  margin-bottom: .5em;
  flex-shrink: 0;
}
.fm-pathbar .bar--left { background-color: #6699cc; border-radius: .8em 0 0 .8em; height: 100%; }
.fm-pathbar .bar--right { background-color: #6699cc; border-radius: 0 .8em .8em 0; height: 100%; }
.fm-pathbar .fm-pathbar-content {
  background-color: #3366cc;
  height: 100%;
  display: flex;
  align-items: center;
  padding: 0 .5em;
  font-family: 'LCARSGTJ3', monospace;
  font-size: .9em;
  color: #fff;
  overflow-x: auto;
  white-space: nowrap;
}
.fm-pathbar-content a {
  color: #f96 !important;
  font-style: normal !important;
  text-decoration: none !important;
  cursor: pointer;
  font-family: 'LCARSGTJ3', monospace;
}
.fm-pathbar-content a:hover { text-decoration: underline !important; }
.fm-pathbar-content span { color: #99c; margin: 0 .2em; }
.fm-pathstat { color: #68c !important; font-size: .85em; margin-left: .8em !important; }

/* File table */
.fm-table-wrap { flex: 1; overflow-y: auto; overflow-x: auto; min-height: 0; }
.fm-table {
  width: 100%;
  border-collapse: collapse;
  font-family: 'LCARSGTJ3', monospace;
  font-size: .85em;
  color: #fff;
}
.fm-table th {
  background-color: #6699cc;
  color: #000;
  text-align: left;
  padding: .4em .6em;
  font-weight: normal;
  cursor: pointer;
  user-select: none;
}
.fm-table th:hover { background-color: #99c; }
.fm-table td {
  padding: .3em .6em;
  vertical-align: middle;
}
.fm-table tr:nth-child(odd) td { background-color: rgba(102, 153, 255, 0.12); }
.fm-table tr:nth-child(even) td { background-color: rgba(153, 153, 204, 0.10); }
.fm-table tr.selected td { background-color: #f96 !important; color: #000 !important; }
.fm-table tr.selected td .fm-name { color: #000; }
.fm-table tr.selected td .fm-name-dir { color: #000; }
.fm-table tr.selected td .fm-size { color: #000; }
.fm-table tr.selected td .fm-type { color: #000; }
.fm-table tr.selected td .fm-modified { color: #000; }
.fm-table tr.selected td .fm-num { background-color: #000; color: #f96; }
.fm-table .fm-name {
  cursor: pointer;
  color: #99ccff;
  font-style: normal !important;
  text-decoration: none;
  font-family: 'LCARSGTJ3', monospace;
}
.fm-table .fm-name:hover { text-decoration: underline !important; }
.fm-table .fm-name-dir { color: #8899ff; }
.fm-table .fm-size { color: #99c; text-align: right; }
.fm-table .fm-type { color: #c9c; }
.fm-table .fm-modified { color: #99c; white-space: nowrap; font-size: .8em; }
.fm-table .fm-num {
  display: inline-block;
  width: 1.8em;
  height: 1.4em;
  text-align: center;
  background-color: #000;
  color: #c69;
  margin-right: 0;
  font-size: .8em;
  line-height: 1.4em;
  vertical-align: middle;
  border-radius: 2px;
}

/* Status bar - fixed at bottom */
.fm-statusbar {
  display: none;
}

/* Drag & drop hover */
tr.drag-over td { background-color: #f96 !important; box-shadow: inset 0 0 0 2px #fff; }

/* Preview text */
.fm-preview-text {
  max-height: 60vh;
  overflow: auto;
  background: #111;
  color: #99ccff;
  padding: 1em;
  font-family: 'LCARSGTJ3', monospace;
  font-size: .8em;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-all;
  border-radius: 4px;
  margin: 0;
}

/* Editable text box (textarea variant) */
textarea.fm-preview-text {
  display: block;
  width: 100%;
  min-height: 45vh;
  max-height: 60vh;
  resize: vertical;
  box-sizing: border-box;
  border: 1px solid #99f;
  outline: none;
}
textarea.fm-preview-text:focus { border-color: #f96; }

/* Status bar legacy */
.fm-statusbar .bar--left { background-color: #6699cc; border-radius: .6em 0 0 .6em; height: 100%; }
.fm-statusbar .bar--right { background-color: #6699cc; border-radius: 0 .6em .6em 0; height: 100%; }
.fm-statusbar-content {
  background-color: #3366cc;
  height: 100%;
  display: flex;
  align-items: center;
  padding: 0 .5em;
  font-family: 'LCARSGTJ3', monospace;
  font-size: .72em;
  color: #fff;
  gap: 1em;
}

/* Modal */
.fm-modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.75);
  z-index: 999;
  justify-content: center;
  align-items: center;
}
.fm-modal {
  background: #000;
  border: 1px solid #f96;
  border-radius: .8em;
  padding: 0;
  width: 440px;
  max-width: 95vw;
  font-family: 'LCARSGTJ3', monospace;
  overflow: hidden;
}
.fm-modal-header {
  background: #f96;
  color: #000;
  padding: .5em .7em;
  font-size: 1.1em;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.fm-modal-close {
  cursor: pointer;
  color: #000;
  font-size: 1.2em;
  line-height: 1;
}
.fm-modal-body {
  padding: .8em;
  color: #fff;
}
.fm-modal-body input[type="text"] {
  width: 100%;
  padding: .5em;
  font-size: 1em;
  background: #111;
  border: 1px solid #99f;
  color: #fff;
  font-family: 'LCARSGTJ3', monospace;
}
.fm-modal-body .fm-delete-list {
  margin-bottom: .8em;
  max-height: 150px;
  overflow-y: auto;
  color: #c66;
  line-height: 1.6;
}
.fm-modal-footer {
  padding: .5em .7em;
  display: flex;
  gap: .5em;
  justify-content: flex-end;
}
.fm-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: .3em 1.2em;
  font-family: 'LCARSGTJ3', monospace;
  font-size: 1em;
  cursor: pointer;
  border-radius: 1.4em;
  border: 0;
  color: #000;
  min-height: 36px;
  text-decoration: none;
}
.fm-btn-ok { background-color: #f96; }
.fm-btn-cancel { background-color: #99f; }

/* Loading / empty */
.fm-loading, .fm-empty {
  text-align: center;
  padding: 2em;
  color: #99c;
  font-family: 'LCARSGTJ3', monospace;
  font-size: 1.1em;
}

/* Active button highlight on left nav */
.nav__link.fm-active-btn,
.nav__link.fm-active-btn::after { background-color: #f96 !important; }

/* Nav button color variants via inline style overrides */
/* Keep hover states working */

/* ===== LOCK SCREEN ===== */
#lock-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: #000;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}
.lock-container {
  width: 520px;
  max-width: 90vw;
  font-family: 'LCARSGTJ3', monospace;
}
.lock-top-bar {
  display: grid;
  grid-template-columns: .8em 1fr .8em;
  grid-template-rows: 1.5em;
  grid-gap: .2em;
  margin-bottom: .3em;
}
.lock-top-bar .lock-bar-left {
  background-color: #cc6666;
  border-radius: 1em 0 0 1em;
}
.lock-top-bar .lock-bar-mid {
  background-color: #cc6666;
}
.lock-top-bar .lock-bar-right {
  background-color: #cc6666;
  border-radius: 0 1em 1em 0;
}
.lock-title-box {
  display: grid;
  grid-template-columns: .8em 1fr .8em;
  grid-template-rows: auto;
  grid-gap: .2em;
  margin-bottom: .3em;
}
.lock-title-box .lock-bar-l { background-color: #f96; border-radius: .5em 0 0 .5em; }
.lock-title-box .lock-bar-m {
  background-color: #f96;
  color: #000;
  padding: .6em .8em;
  font-size: 1.4em;
  text-align: center;
  letter-spacing: .1em;
}
.lock-title-box .lock-bar-r { background-color: #f96; border-radius: 0 .5em .5em 0; }
.lock-subtitle {
  color: #cc6666;
  text-align: center;
  font-size: 1em;
  margin: .5em 0 1em;
  letter-spacing: .05em;
}
.lock-steps {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: .4em;
  margin: 0 0 .8em;
}
.lock-step {
  display: inline-flex;
  align-items: center;
  gap: .4em;
  padding: .25em .7em;
  border-radius: 1em;
  background: #334;
  color: #6699cc;
  font-family: 'LCARSGTJ3', monospace;
  font-size: .85em;
  letter-spacing: .04em;
  opacity: .6;
}
.lock-step__n {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.3em;
  height: 1.3em;
  border-radius: 50%;
  background: #6699cc;
  color: #000;
  font-size: .9em;
}
.lock-step.is-active {
  background: #f96;
  color: #000;
  opacity: 1;
}
.lock-step.is-active .lock-step__n { background: #000; color: #f96; }
.lock-step.is-done {
  background: #6699cc;
  color: #000;
  opacity: 1;
}
.lock-step.is-done .lock-step__n { background: #000; color: #6699cc; }
.lock-step[hidden] { display: none; }
.lock-code {
  margin: 0 auto .8em;
  padding: .25em .8em;
  background: #000;
  border: 1px solid #f96;
  border-radius: .5em;
  color: #f96;
  font-family: 'LCARSGTJ3', monospace;
  font-size: 2.4em;
  letter-spacing: .35em;
  text-indent: .35em;
  text-align: center;
}
.lock-code[hidden] { display: none; }
.lock-input-row {
  display: grid;
  grid-template-columns: 1.5em 1fr 1.5em;
  grid-template-rows: 2.2em;
  grid-gap: .2em;
  margin-bottom: .5em;
}

<script>
// ========== ES5 JavaScript ==========
var currentPath = '';
var clipboard = {action: '', src: '', names: []};
var selectedFiles = [];
var sortBy = 'name';
var sortOrder = 'asc';
var allFiles = [];

// Button definitions with LCARS color variants
var navButtons = [
  { label: 'LOCK',       num: '01', color: '#f90',    bgAfter: '#f90' },
  { label: 'IMPORT',     num: '02', color: '#99f',    bgAfter: '#99f' },
  { label: 'EXPORT',     num: '03', color: '#b8a9cf', bgAfter: '#b8a9cf' },
  { label: 'REFRESH',    num: '04', color: '#99f',    bgAfter: '#99f' },
  { label: 'BACK',       num: '05', color: '#9b8ccf', bgAfter: '#9b8ccf' },
  { label: 'NEW FOLDER', num: '06', color: '#99f',    bgAfter: '#99f' },
  { label: 'CUT',        num: '07', color: '#cc9',    bgAfter: '#cc9' },
  { label: 'COPY',       num: '08', color: '#b8a9cf', bgAfter: '#b8a9cf' },
  { label: 'PASTE',      num: '09', color: '#9b8ccf', bgAfter: '#9b8ccf' },
  { label: 'RENAME',     num: '10', color: '#99f',    bgAfter: '#99f' },
  { label: 'DELETE',     num: '11', color: '#cc6666', bgAfter: '#cc6666' },
  { label: 'SEARCH',     num: '12', color: '#99f',    bgAfter: '#99f' },
  { label: 'NEW FILE',   num: '13', color: '#cc9',    bgAfter: '#cc9' }
];

function buildNav() {
  var list = document.getElementById('nav-list');
  var html = '';
  for (var i = 0; i < navButtons.length; i++) {
    var b = navButtons[i];
    html += '<li class="nav__entry"><a class="nav__link" data-num="' + b.num + '" href="#" ' +
      'onclick="handleNavClick(' + i + ',event)" ' +
      'style="background-color:' + b.color + ';" ' +
      'data-bg="' + b.color + '" data-bgafter="' + b.bgAfter + '">' + b.label + '</a></li>';
  }
  list.innerHTML = html;
}

function handleNavClick(idx, e) {
  e.preventDefault(); e.stopPropagation();
  switch (idx) {
    case 0: lockVault(); break;         // LOCK
    case 1: handleUpload(); break;      // IMPORT
    case 2: downloadSelected(); break;  // EXPORT
    case 3: refreshFiles(); break;      // REFRESH
    case 4: navigateUp(); break;        // BACK
    case 5: createDir(); break;         // NEW FOLDER
    case 6: doCut(); break;             // CUT
    case 7: doCopy(); break;            // COPY
    case 8: doPaste(); break;           // PASTE
    case 9: doRename(); break;          // RENAME
    case 10: doDelete(); break;         // DELETE
    case 11: doSearch(); break;         // SEARCH
    case 12: createFile(); break;       // NEW FILE
  }
  return false;
}

// ========== LOCK VAULT ==========
// Lock the container and return to the main page (app.html).
function lockVault() {
  playSound('chirp');
  if (window.stvault) {
    try { window.stvault.invoke('vault.lock', {}).catch(function() {}); } catch (e) {}
    window.stvault.go('app.html');
  }
}

// ========== SOUND ==========
function playSound(type) {
  try {
    var el = null;
    if (type === 'chirp') el = document.getElementById('snd-chirp');
    else if (type === 'beep') el = document.getElementById('snd-beep');
    else if (type === 'warning') el = document.getElementById('snd-warning');
    else if (type === 'error') el = document.getElementById('snd-error');
    else if (type === 'verify') el = document.getElementById('snd-verify');
    if (el) { el.currentTime = 0; el.play(); }
  } catch (ex) {}
}

// ========== FILE OPERATIONS ==========
function loadFiles(path) {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', '?action=list&path=' + encodeURIComponent(path || ''), true);
  xhr.onload = function() {
    if (xhr.status === 200) {
      try {
        var data = JSON.parse(xhr.responseText);
        allFiles = data.files || [];
        sortAndRender();
        updateStatus();
      } catch (ex) {
        showError('Failed to parse response');
      }
    } else {
      showError('Server error: ' + xhr.status);
    }
  };
  xhr.onerror = function() { showError('Network error'); };
  xhr.send();
  playSound('chirp');
}

function refreshFiles() {
  selectedFiles = [];
  loadFiles(currentPath);
}

function sortAndRender() {
  var order = sortOrder === 'asc' ? 1 : -1;
  allFiles.sort(function(a, b) {
    // dirs first
    if (a.is_dir && !b.is_dir) return -1;
    if (!a.is_dir && b.is_dir) return 1;
    if (sortBy === 'name') return order * a.name.localeCompare(b.name, undefined, {sensitivity:'base'});
    if (sortBy === 'size') return order * (a.size - b.size);
    if (sortBy === 'type') {
      var ta = a.is_dir ? '0dir' : a.type;
      var tb = b.is_dir ? '0dir' : b.type;
      return order * ta.localeCompare(tb, undefined, {sensitivity:'base'});
    }
    if (sortBy === 'modified') return order * (new Date(a.modified) - new Date(b.modified));
    return 0;
  });
  renderFileList(allFiles);
}

function renderFileList(data) {
  var tbody = document.getElementById('file-tbody');
  if (data.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" class="fm-empty">Empty directory</td></tr>';
    return;
  }
  var html = '';
  for (var i = 0; i < data.length; i++) {
    var f = data[i];
    var num = (i < 9 ? '0' : '') + (i + 1);
    var cls = selectedFiles.indexOf(i) >= 0 ? ' selected' : '';
    var nameCls = 'fm-name' + (f.is_dir ? ' fm-name-dir' : '');
    var sizeStr = f.is_dir ? '&lt;DIR&gt;' : formatSize(f.size);
    var modStr = f.modified;
    html += '<tr class="' + cls + '" data-idx="' + i + '" data-name="' + escapeHtml(f.name) + '" data-isdir="' + f.is_dir + '" draggable="true" onclick="selectFile(' + i + ', event)" ondblclick="handleDoubleClick(' + i + ', event)" ondragstart="dragFileStart(event)" ondragend="dragFileEnd(event)">' +
      '<td><span class="fm-num">' + num + '</span><a class="' + nameCls + '" href="#" onclick="handleDoubleClick(' + i + ', event)">' + escapeHtml(f.name) + '</a></td>' +
      '<td class="fm-size">' + sizeStr + '</td>' +
      '<td class="fm-type">' + (f.is_dir ? 'DIR' : f.type.toUpperCase()) + '</td>' +
      '<td class="fm-modified">' + modStr + '</td>' +
      '</tr>';
  }
  tbody.innerHTML = html;
  // Attach drop handlers to directory rows
  var trs = tbody.querySelectorAll('tr');
  for (var r = 0; r < trs.length; r++) {
    var tr = trs[r];
    if (tr.getAttribute('data-isdir') === 'true') {
      tr.addEventListener('dragover', dragDirOver);
      tr.addEventListener('dragleave', dragDirLeave);
      tr.addEventListener('drop', dragDirDrop);
    }
  }
}

function updateStatus() {
  var total = allFiles.length;
  var dirs = 0, files = 0;
  for (var i = 0; i < allFiles.length; i++) {
    if (allFiles[i].is_dir) dirs++; else files++;
  }
  var sel = selectedFiles.length;
  updatePathbar(total, dirs, files, sel);
}

function updatePathbar(total, dirs, files, sel) {
  var bar = document.getElementById('pathbar');
  var pathStr = currentPath || '';
  var html = '<a href="#" onclick="navigateTo(\'\',event)">/ share</a>';
  if (currentPath) {
    var parts = currentPath.replace(/\/$/, '').split('/');
    var accum = '';
    for (var i = 0; i < parts.length; i++) {
      if (!parts[i]) continue;
      accum += (accum ? '/' : '') + parts[i];
      html += ' <span>/</span> <a href="#" onclick="navigateTo(\'' + escapeStr(accum) + '\',event)">' + escapeHtml(parts[i]) + '</a>';
    }
  }
  html += ' <span class="fm-pathstat">| ' + total + ' items (' + dirs + ' dirs, ' + files + ' files)';
  if (sel > 0) html += ' · Selected: ' + sel;
  html += '</span>';
  bar.innerHTML = html;
}

function navigateTo(path, e) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  currentPath = path;
  selectedFiles = [];
  loadFiles(currentPath);
}

function navigateUp(e) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  if (!currentPath) return;
  var parts = currentPath.replace(/\/$/, '').split('/');
  parts.pop();
  currentPath = parts.join('/');
  if (currentPath) currentPath += '/';
  selectedFiles = [];
  loadFiles(currentPath);
  playSound('chirp');
}

function selectFile(idx, event) {
  var pos = selectedFiles.indexOf(idx);
  if (event.ctrlKey || event.metaKey) {
    if (pos >= 0) selectedFiles.splice(pos, 1);
    else selectedFiles.push(idx);
  } else {
    if (pos >= 0 && selectedFiles.length === 1) {
      selectedFiles = [];
    } else {
      selectedFiles = [idx];
    }
  }
  sortAndRender();
  updateStatus();
  playSound('chirp');
}

function handleDoubleClick(idx, e) {
  e.preventDefault(); e.stopPropagation();
  var f = allFiles[idx];
  if (!f) return;
  if (f.is_dir) {
    var newPath = currentPath ? (currentPath.replace(/\/$/, '') + '/' + f.name + '/') : (f.name + '/');
    navigateTo(newPath);
  } else {
    previewFile(f.name, idx);
  }
}

// ========== DRAG & DROP MOVE ==========
var dragIdx = -1, dragTr = null;
var dragOutActive = false;

function dragFileStart(e) {
  dragTr = e.target.closest('tr');
  if (!dragTr) return;
  dragIdx = parseInt(dragTr.getAttribute('data-idx'));
  var f = allFiles[dragIdx];
  if (!f) return;

  // Alt/Cmd + drag: export out of the vault via OS-level drag (webContents.startDrag).
  // Handled in the preload/main process; fall back to internal move if the API is absent.
  if ((e.altKey || e.metaKey) && !f.is_dir && window.stvault && typeof window.stvault.dragBegin === 'function') {
    e.preventDefault();
    dragOutActive = true;
    playSound('chirp');
    window.stvault.dragBegin({ path: currentPath, file: f.name }).then(function (res) {
      if (res && res.temp_path) {
        // Temp plaintext is wiped by main-process blur/timer or released here as fallback.
        setTimeout(function () {
          if (window.stvault.releaseTemp) window.stvault.releaseTemp(res.temp_path);
        }, 30000);
      }
    }).catch(function () { playSound('error'); });
    dragIdx = -1;
    dragTr = null;
    return;
  }

  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragTr.getAttribute('data-name'));
  setTimeout(function(){ if(dragTr) dragTr.style.opacity = '0.4'; }, 0);
}

function dragFileEnd(e) {
  if (dragTr) dragTr.style.opacity = '';
  dragIdx = -1;
  dragTr = null;
  dragOutActive = false;
}

function dragDirOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  var tr = e.target.closest('tr');
  if (tr && tr.getAttribute('data-isdir') === 'true') {
    tr.classList.add('drag-over');
  }
}

function dragDirLeave(e) {
  var tr = e.target.closest('tr');
  if (tr) tr.classList.remove('drag-over');
}

function dragDirDrop(e) {
  e.preventDefault();
  var tr = e.target.closest('tr');
  if (!tr) return;
  tr.classList.remove('drag-over');
  if (dragIdx < 0) return;
  var destIdx = parseInt(tr.getAttribute('data-idx'));
  var srcFile = allFiles[dragIdx];
  var destFile = allFiles[destIdx];
  if (!srcFile || !destFile || !destFile.is_dir || srcFile.name === destFile.name) return;
  // Don't move a directory into itself or its subdir
  if (srcFile.is_dir) {
    var destPath = currentPath ? (currentPath + destFile.name + '/') : (destFile.name + '/');
    var srcPath = currentPath ? (currentPath + srcFile.name + '/') : (srcFile.name + '/');
    if (srcPath.indexOf(destPath.replace(/\/$/, '/')) === 0) { playSound('error'); dragFileEnd(e); return; }
  }
  moveFile(srcFile.name, destFile.name);
  dragFileEnd(e);
}

// ========== DRAG-IN IMPORT (from Finder / Explorer) ==========
function hasExternalFiles(e) {
  if (!e.dataTransfer) return false;
  var types = e.dataTransfer.types;
  if (!types) return false;
  for (var i = 0; i < types.length; i++) {
    if (types[i] === 'Files') return true;
  }
  return false;
}

function containerDragOver(e) {
  if (!hasExternalFiles(e)) return;
  e.preventDefault();
  e.stopPropagation();
  e.dataTransfer.dropEffect = 'copy';
}

function containerDrop(e) {
  if (!hasExternalFiles(e)) return;
  e.preventDefault();
  e.stopPropagation();
  var files = e.dataTransfer.files;
  if (!files || !files.length) return;
  doUpload(files);
}

function moveFile(srcName, destDirName) {
  var destPath = currentPath ? (currentPath + destDirName + '/') : (destDirName + '/');
  var xhr = new XMLHttpRequest();
  xhr.open('POST', '?action=move', true);
  xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
  xhr.onload = function() {
    if (xhr.status === 200) {
      try { var r = JSON.parse(xhr.responseText); } catch(e) {}
      refreshFiles();
      playSound('chirp');
    } else {
      playSound('error');
    }
  };
  xhr.onerror = function() { playSound('error'); };
  xhr.send('src_path=' + encodeURIComponent(currentPath) + '&src_name=' + encodeURIComponent(srcName) + '&dest_path=' + encodeURIComponent(destPath));
}

// ========== FILE PREVIEW ==========
function previewFile(name, idx) {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', '?action=read&path=' + encodeURIComponent(currentPath) + '&file=' + encodeURIComponent(name), true);
  xhr.onload = function() {
    if (xhr.status !== 200) { downloadFile(name); return; }
    try {
      var r = JSON.parse(xhr.responseText);
      if (r.type === 'image') {
        showModal('Preview: ' + name,
          '<div style="text-align:center"><img src="' + r.url + '" style="max-width:100%;max-height:60vh" alt="' + escapeHtml(name) + '"></div>',
          [{text:'DOWNLOAD', cls:'fm-btn-ok', onclick:'closeModal();downloadFile(\''+escapeStr(name)+'\')'},{text:'CLOSE', cls:'fm-btn-cancel', onclick:'closeModal()'}]
        );
      } else if (r.type === 'video') {
        showModal('Preview: ' + name,
          '<div style="text-align:center"><video controls style="max-width:100%;max-height:60vh"><source src="'+r.url+'"></video></div>',
          [{text:'DOWNLOAD', cls:'fm-btn-ok', onclick:'closeModal();downloadFile(\''+escapeStr(name)+'\')'},{text:'CLOSE', cls:'fm-btn-cancel', onclick:'closeModal()'}]
        );
      } else if (r.type === 'audio') {
        showModal('Preview: ' + name,
          '<div style="text-align:center"><audio controls style="width:100%;margin:1em 0"><source src="'+r.url+'"></audio></div>',
          [{text:'DOWNLOAD', cls:'fm-btn-ok', onclick:'closeModal();downloadFile(\''+escapeStr(name)+'\')'},{text:'CLOSE', cls:'fm-btn-cancel', onclick:'closeModal()'}]
        );
      } else if (r.text !== undefined) {
        // Text-like files (txt, md, json, ...) open in an editable box.
        var editable = !r.truncated;
        var editBody = '<textarea class="fm-preview-text" id="fm-edit-text"' +
          (editable ? '' : ' readonly') + '>' + escapeHtml(r.text) + '</textarea>';
        if (!editable) {
          editBody += '<p class="note">File truncated (showing first 100KB) &mdash; editing disabled.</p>';
        }
        var editBtns = [];
        if (editable) editBtns.push({text:'SAVE', cls:'fm-btn-ok', onclick:"saveText('"+escapeStr(name)+"')"});
        editBtns.push({text:'DOWNLOAD', cls:'fm-btn-ok', onclick:"closeModal();downloadFile('"+escapeStr(name)+"')"});
        editBtns.push({text:'CLOSE', cls:'fm-btn-cancel', onclick:'closeModal()'});
        showModal((editable ? 'Open: ' : 'Preview: ') + name, editBody, editBtns);
      } else {
        downloadFile(name);
      }
    } catch(e) { downloadFile(name); }
  };
  xhr.onerror = function() { downloadFile(name); };
  xhr.send();
  playSound('chirp');
}

function downloadFile(name) {
  var url = '?action=download&path=' + encodeURIComponent(currentPath) + '&file=' + encodeURIComponent(name);
  var a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  playSound('chirp');
}

function downloadSelected() {
  if (selectedFiles.length === 0) { playSound('error'); return; }
  playSound('chirp');
  for (var i = 0; i < selectedFiles.length; i++) {
    var f = allFiles[selectedFiles[i]];
    if (!f.is_dir) downloadFile(f.name);
  }
}

// ========== UPLOAD ==========
function handleUpload() {
  document.getElementById('upload-input').click();
  playSound('chirp');
}

function doUpload(fileList) {
  var fd = new FormData();
  fd.append('path', currentPath);
  for (var i = 0; i < fileList.length; i++) {
    fd.append('files[]', fileList[i]);
  }
  var xhr = new XMLHttpRequest();
  xhr.open('POST', '?action=upload', true);
  xhr.onload = function() {
    if (xhr.status === 200) {
      try {
        var data = JSON.parse(xhr.responseText);
        playSound('chirp');
      } catch(ex) { playSound('error'); }
      refreshFiles();
    } else {
      playSound('error');
    }
  };
  xhr.onerror = function() { playSound('error'); };
  xhr.send(fd);
  // Reset input
  document.getElementById('upload-input').value = '';
}

// ========== CREATE DIR ==========
function createDir() {
  showModal('New Directory',
    '<input type="text" id="modal-input" placeholder="Enter directory name..." onkeydown="if(event.keyCode===13)confirmDir()">',
    [ { text: 'CREATE', cls: 'fm-btn-ok', onclick: 'confirmDir()' },
      { text: 'CANCEL', cls: 'fm-btn-cancel', onclick: 'closeModal()' } ]
  );
  setTimeout(function() { document.getElementById('modal-input').focus(); }, 100);
  playSound('chirp');
}

function confirmDir() {
  var name = document.getElementById('modal-input').value.trim();
  if (!name) { closeModal(); return; }
  var xhr = new XMLHttpRequest();
  xhr.open('POST', '?action=mkdir', true);
  xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
  xhr.onload = function() {
    try { JSON.parse(xhr.responseText); } catch(ex){}
    refreshFiles();
    playSound('chirp');
  };
  xhr.onerror = function() { playSound('error'); };
  xhr.send('path=' + encodeURIComponent(currentPath) + '&name=' + encodeURIComponent(name));
  closeModal();
}

// ========== CREATE FILE ==========
// Create a new (empty) text file. The user types the full name including its
// extension, e.g. "notes.txt" or "readme.md". A name without a dot gets ".txt".
function createFile() {
  showModal('New File',
    '<input type="text" id="modal-input" placeholder="e.g. notes.txt or readme.md" onkeydown="if(event.keyCode===13)confirmFile()">',
    [ { text: 'CREATE', cls: 'fm-btn-ok', onclick: 'confirmFile()' },
      { text: 'CANCEL', cls: 'fm-btn-cancel', onclick: 'closeModal()' } ]
  );
  setTimeout(function() { var i = document.getElementById('modal-input'); if (i) i.focus(); }, 100);
  playSound('chirp');
}

function confirmFile() {
  var name = document.getElementById('modal-input').value.trim();
  closeModal();
  if (!name) return;
  if (name.indexOf('.') < 0) name += '.txt';
  if (!window.stvault) { playSound('error'); return; }
  window.stvault.invoke('vfs.write', { path: currentPath, name: name, text: '' }).then(function() {
    refreshFiles();
    playSound('chirp');
  }).catch(function() { playSound('error'); });
}

// Save an edited text file back into the container.
function saveText(name) {
  var el = document.getElementById('fm-edit-text');
  if (!el || !window.stvault) return;
  window.stvault.invoke('vfs.write', { path: currentPath, name: name, text: el.value }).then(function() {
    closeModal();
    refreshFiles();
    playSound('chirp');
  }).catch(function() { playSound('error'); });
}

// ========== DELETE ==========
function doDelete() {
  var sel = getSelectedNames();
  if (sel.length === 0) { playSound('error'); alert('No files selected.'); return; }
  var listHtml = '';
  for (var i = 0; i < sel.length; i++) {
    listHtml += '<div>' + escapeHtml(sel[i]) + '</div>';
  }
  showModal('Confirm Delete',
    '<div class="fm-delete-list">' + listHtml + '</div><p style="color:#f96;">Delete these ' + sel.length + ' item(s)?</p>',
    [ { text: 'DELETE', cls: 'fm-btn-ok', onclick: 'confirmDelete()', style: 'background-color:#cc6666' },
      { text: 'CANCEL', cls: 'fm-btn-cancel', onclick: 'closeModal()' } ]
  );
  playSound('warning');
}

function confirmDelete() {
  var names = [];
  var sel = selectedFiles.slice().sort(function(a,b) { return b-a; });
  for (var i = 0; i < sel.length; i++) {
    names.push(allFiles[sel[i]].name);
  }
  var xhr = new XMLHttpRequest();
  xhr.open('POST', '?action=delete', true);
  xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
  xhr.onload = function() {
    try { JSON.parse(xhr.responseText); } catch(ex){}
    selectedFiles = [];
    refreshFiles();
    playSound('chirp');
  };
  xhr.onerror = function() { playSound('error'); };
  var params = 'path=' + encodeURIComponent(currentPath);
  for (var j = 0; j < names.length; j++) {
    params += '&names[]=' + encodeURIComponent(names[j]);
  }
  xhr.send(params);
  closeModal();
}

// ========== RENAME ==========
function doRename() {
  var sel = getSelectedNames();
  if (sel.length !== 1) { playSound('error'); alert('Select exactly one file to rename.'); return; }
  showModal('Rename: ' + sel[0],
    '<input type="text" id="modal-input" value="' + escapeAttr(sel[0]) + '" onkeydown="if(event.keyCode===13)confirmRename()">',
    [ { text: 'RENAME', cls: 'fm-btn-ok', onclick: 'confirmRename()' },
      { text: 'CANCEL', cls: 'fm-btn-cancel', onclick: 'closeModal()' } ]
  );
  setTimeout(function() {
    var inp = document.getElementById('modal-input');
    if (inp) { inp.focus(); inp.select(); }
  }, 100);
  playSound('warning');
}

function confirmRename() {
  var newName = document.getElementById('modal-input').value.trim();
  if (!newName) { closeModal(); return; }
  var sel = selectedFiles[0];
  var oldName = allFiles[sel].name;
  var xhr = new XMLHttpRequest();
  xhr.open('POST', '?action=rename', true);
  xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
  xhr.onload = function() {
    try { JSON.parse(xhr.responseText); } catch(ex){}
    selectedFiles = [];
    refreshFiles();
    playSound('chirp');
  };
  xhr.onerror = function() { playSound('error'); };
  xhr.send('path=' + encodeURIComponent(currentPath) + '&old_name=' + encodeURIComponent(oldName) + '&new_name=' + encodeURIComponent(newName));
  closeModal();
}

// ========== COPY / PASTE ==========
function doCopy() {
  var sel = getSelectedNames();
  if (sel.length === 0) { playSound('error'); return; }
  clipboard = { action: 'copy', src: currentPath, names: sel };
  updateStatus();
  playSound('chirp');
  alert('Copied ' + sel.length + ' item(s) to clipboard.');
}

function doCut() {
  var sel = getSelectedNames();
  if (sel.length === 0) { playSound('error'); return; }
  clipboard = { action: 'move', src: currentPath, names: sel };
  updateStatus();
  playSound('chirp');
  alert('Cut ' + sel.length + ' item(s) to clipboard.');
}

function doPaste() {
  if (clipboard.names.length === 0) { playSound('error'); alert('Clipboard is empty.'); return; }
  if (clipboard.src === currentPath) { playSound('error'); alert('Cannot paste to the same directory.'); return; }
  var xhr = new XMLHttpRequest();
  xhr.open('POST', '?action=paste', true);
  xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
  xhr.onload = function() {
    try { JSON.parse(xhr.responseText); } catch(ex){}
    refreshFiles();
    playSound('chirp');
  };
  xhr.onerror = function() { playSound('error'); };
  var params = 'dest=' + encodeURIComponent(currentPath) + '&src=' + encodeURIComponent(clipboard.src) +
    '&action_type=' + clipboard.action;
  for (var i = 0; i < clipboard.names.length; i++) {
    params += '&names[]=' + encodeURIComponent(clipboard.names[i]);
  }
  xhr.send(params);
}

// ========== SEARCH ==========
function doSearch() {
  showModal('Search Files',
    '<input type="text" id="modal-input" placeholder="Enter search term..." onkeydown="if(event.keyCode===13)confirmSearch()">',
    [ { text: 'SEARCH', cls: 'fm-btn-ok', onclick: 'confirmSearch()' },
      { text: 'CANCEL', cls: 'fm-btn-cancel', onclick: 'closeModal()' } ]
  );
  setTimeout(function() { document.getElementById('modal-input').focus(); }, 100);
  playSound('chirp');
}

function confirmSearch() {
  var q = document.getElementById('modal-input').value.trim();
  closeModal();
  if (!q) return;
  var xhr = new XMLHttpRequest();
  xhr.open('GET', '?action=search&path=' + encodeURIComponent(currentPath) + '&q=' + encodeURIComponent(q), true);
  xhr.onload = function() {
    if (xhr.status === 200) {
      try {
        var data = JSON.parse(xhr.responseText);
        allFiles = data.files || [];
        selectedFiles = [];
        sortAndRender();
        updateStatus();
        playSound('chirp');
      } catch(ex) { playSound('error'); }
    }
  };
  xhr.onerror = function() { playSound('error'); };
  xhr.send();
  playSound('chirp');
}

// ========== SORT ==========
function sortFiles(by) {
  if (sortBy === by) {
    sortOrder = sortOrder === 'asc' ? 'desc' : 'asc';
  } else {
    sortBy = by;
    sortOrder = 'asc';
  }
  sortAndRender();
  playSound('beep');
}

function cycleSort() {
  var options = ['name', 'size', 'type', 'modified'];
  var idx = options.indexOf(sortBy);
  idx = (idx + 1) % options.length;
  sortFiles(options[idx]);
}

// ========== MODAL ==========
function showModal(title, bodyHtml, buttons) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHtml;
  var footer = document.getElementById('modal-footer');
  var btnHtml = '';
  for (var i = 0; i < buttons.length; i++) {
    var b = buttons[i];
    btnHtml += '<button class="fm-btn ' + b.cls + '" onclick="' + b.onclick + '"' +
      (b.style ? ' style="' + b.style + '"' : '') + '>' + b.text + '</button>';
  }
  footer.innerHTML = btnHtml;
  document.getElementById('modal-overlay').style.display = 'flex';
}

function closeModal() {
  document.getElementById('modal-overlay').style.display = 'none';
}

// ========== HELPERS ==========
function getSelectedNames() {
  var names = [];
  for (var i = 0; i < selectedFiles.length; i++) {
    names.push(allFiles[selectedFiles[i]].name);
  }
  return names;
}

function formatSize(bytes) {
  if (bytes === 0) return '0 B';
  var k = 1024;
  var sizes = ['B', 'KB', 'MB', 'GB'];
  var i = Math.floor(Math.log(bytes) / Math.log(k));
  if (i >= sizes.length) i = sizes.length - 1;
  return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(str));
  return div.innerHTML;
}

function escapeAttr(str) {
  return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function escapeStr(str) {
  return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}

function showError(msg) {
  document.getElementById('file-tbody').innerHTML = '<tr><td colspan="4" class="fm-empty">' + escapeHtml(msg) + '</td></tr>';
  playSound('error');
}

// ========== SORT COLUMN INDICATOR ==========
// Override sortFiles to also update header indicators
var _origSortFiles = sortFiles;
sortFiles = function(by) {
  _origSortFiles(by);
  // update header cells
  var ths = document.querySelectorAll('.fm-table th');
  for (var i = 0; i < ths.length; i++) {
    ths[i].textContent = ths[i].textContent.replace(/ [\u25B2\u25BC]/g, '');
  }
  // map by to column index
  var map = {name:0, size:1, type:2, modified:3};
  var col = map[by];
  if (col !== undefined && ths[col]) {
    ths[col].textContent += ' ' + (sortOrder === 'asc' ? '\u25B2' : '\u25BC');
  }
};

// ========== INIT ==========
window.onload = function() {
  buildNav();
  loadFiles('');
  // Drag-and-drop import: allow dropping files from Finder/Explorer anywhere
  // in the main content area.
  var mainEl = document.getElementById('main__container');
  if (mainEl) {
    mainEl.addEventListener('dragover', containerDragOver);
    mainEl.addEventListener('drop', containerDrop);
  }
  var btn = document.getElementById('lock-btn');
  if (btn) btn.focus();
};

// ========== LOCK SCREEN ==========
// The lock screen is driven by fm-bridge.js (voiceprint unlock). The page only
// provides the RECORD / BACK buttons and status/error areas; stvaultLockPrimary
// and stvaultLockBack are defined there and bound via the buttons' onclick.

// Fix nav__link after pseudo-element colors for variant buttons
// Use MutationObserver or just apply via style on the ::after via CSS custom properties not possible in old browsers.
// Instead, we handle it by adding a style block after nav build.
function applyNavAfterColors() {
  var links = document.querySelectorAll('.nav__link');
  var styleEl = document.createElement('style');
  var css = '';
  for (var i = 0; i < links.length; i++) {
    var afterColor = links[i].getAttribute('data-bgafter');
    if (afterColor) {
      css += '.nav__list .nav__entry:nth-child(' + (i+1) + ') .nav__link::after { background-color: ' + afterColor + ' !important; }\n';
    }
  }
  styleEl.textContent = css;
  document.head.appendChild(styleEl);
}
// Call after build
var _origBuildNav = buildNav;
buildNav = function() {
  _origBuildNav();
  applyNavAfterColors();
};
</script>
