# sherpa-onnx 静态库链接路径。
#
# 磁盘与时间节省：sherpa-onnx-sys 默认会下载并解压一份 ~112 MB 的预编译静态库
# （sherpa-onnx-v1.13.8-osx-arm64-static-lib）。本机已经有一份解压好的，位于
# /Users/zhj/Projects/funasr-cli/rust-asr/target/sherpa-onnx-prebuilt/，
# 直接指向它即可免去重复下载 / 解压。
#
# force = false：若环境里已显式设置 SHERPA_ONNX_LIB_DIR，则保留用户值。
# 换机 / 换路径：export SHERPA_ONNX_LIB_DIR=<...>/sherpa-onnx-v1.13.8-osx-arm64-static-lib/lib
[env]
SHERPA_ONNX_LIB_DIR = { value = "/Users/zhj/Projects/funasr-cli/rust-asr/target/sherpa-onnx-prebuilt/sherpa-onnx-v1.13.8-osx-arm64-static-lib/lib", force = false }